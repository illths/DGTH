<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dummies Guide to Hakuda (DGTH)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding-top: 40px;
            box-sizing: border-box;
        }
        .workspace {
            width: 90%;
            max-width: 800px;
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1 {
            color: #00adb5;
            margin: 0 0 5px 0;
            font-size: 2.2rem;
            letter-spacing: 1px;
        }
        .subtitle {
            color: #aaaaaa;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .search-area {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        .search-input {
            flex: 1;
            padding: 12px 18px;
            font-size: 16px;
            border: 2px solid #333;
            border-radius: 6px;
            background-color: #252525;
            color: white;
            outline: none;
            transition: border-color 0.3s;
        }
        .search-input:focus {
            border-color: #00adb5;
        }
        .search-button {
            padding: 12px 24px;
            font-size: 16px;
            background-color: #00adb5;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .search-button:hover {
            background-color: #008f96;
        }
        .results-box {
            background-color: #161616;
            border-radius: 8px;
            padding: 20px;
            border: 1px solid #2d2d2d;
            min-height: 150px;
        }
        .result-item {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #2a2a2a;
        }
        .result-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        .result-title {
            font-size: 18px;
            color: #00adb5;
            margin: 0 0 5px 0;
            font-weight: bold;
        }
        .result-snippet {
            font-size: 14px;
            color: #cccccc;
            line-height: 1.5;
            margin: 0;
        }
        .status-msg {
            color: #888888;
            font-style: italic;
            text-align: center;
            margin-top: 50px;
        }
        .math-result {
            font-size: 24px;
            color: #4caf50;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="workspace">
        <h1>DGTH</h1>
        <div class="subtitle">Internal Local Reference & Smart Utility Dashboard</div>
        
        <div class="search-area">
            <input type="text" id="queryInput" class="search-input" placeholder="Ask a question, enter math (e.g. 2+1), or search keywords..." autocomplete="off">
            <button onclick="processSmartSearch()" class="search-button">Search</button>
        </div>

        <div id="resultsContainer" class="results-box">
            <p class="status-msg">Results container empty. Enter a query above to calculate or filter reference assets.</p>
        </div>
    </div>

    <script>
        // Local informational index
        const localDatabase = [
            {
                title: "Computer Systems & Hardware",
                keywords: ["computer", "pc", "hardware", "cpu", "ram", "technology"],
                snippet: "A computer system consists of hardware components (CPU, memory, storage, input/output devices) and software. The Central Processing Unit (CPU) executes instructions, while RAM provides volatile working memory for active processes."
            },
            {
                title: "Algebra & Mathematical Functions",
                keywords: ["math", "algebra", "calculus", "function", "equation"],
                snippet: "Algebraic expressions utilize variables, constants, and operational symbols to represent relationships. A function maps an input value to exactly one output value, commonly defined as f(x)."
            },
            {
                title: "Essay Structure & Academic Writing",
                keywords: ["essay", "writing", "english", "thesis", "paragraph"],
                snippet: "Standard academic essays follow a structured format: an introductory paragraph containing a clear thesis statement, body paragraphs providing evidence and critical analysis, and a conclusion summarizing main arguments."
            },
            {
                title: "Hakuda Techniques Overview",
                keywords: ["hakuda", "guide", "dgth", "basics"],
                snippet: "Hakuda is a hand-to-hand combat discipline focusing on physical strikes, blocks, and agility. Training emphasizes core stability, timing, and using an opponent's momentum against them."
            }
        ];

        document.getElementById('queryInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                processSmartSearch();
            }
        });

        function processSmartSearch() {
            const rawQuery = document.getElementById('queryInput').value.trim();
            const query = rawQuery.toLowerCase();
            const container = document.getElementById('resultsContainer');
            
            if (!query) {
                container.innerHTML = '<p class="status-msg" style="color: #ff5722;">Please enter a search term.</p>';
                return;
            }

            container.innerHTML = '<p class="status-msg">Processing query...</p>';

            // 1. CHECK FOR MATH EQUATIONS (e.g. 2+1, 45*3, 10-5)
            // Regex detects numbers separated by standard math operators
            const mathRegex = /^[\d\s.+\-*/()]+\$/;
            if (mathRegex.test(rawQuery) && /[+\-*/]/.test(rawQuery)) {
                try {
                    // Evaluate the arithmetic string safely using a Function wrapper
                    const calculation = new Function(`return ${rawQuery}`)();
                    
                    setTimeout(() => {
                        container.innerHTML = `
                            <div class="result-item">
                                <div class="result-title">Math Calculator Utility</div>
                                <p class="result-snippet">Calculated value for expression: <strong>${rawQuery}</strong></p>
                                <p class="math-result">= ${calculation}</p>
                            </div>
                        `;
                    }, 150);
                    return;
                } catch (e) {
                    // Fall through if it's an invalid equation string
                }
            }

            // 2. CHECK FOR CONVERSATIONAL QUESTIONS (Simple rule-based engine)
            if (query.startsWith("hello") || query.startsWith("hi")) {
                setTimeout(() => {
                    container.innerHTML = `
                        <div class="result-item">
                            <div class="result-title">DGTH Assistant</div>
                            <p class="result-snippet">Hello! I am your completely offline smart utility dashboard. You can type math equations directly into the box, or ask about system topics like "math", "computer", or "essay".</p>
                        </div>
                    `;
                }, 150);
                return;
            }

            // 3. FALLBACK: LOCAL ENCYCLOPEDIA DATABASE FILTER
            // Requires keywords to match closely rather than checking single character subsets globally
            const matchedResults = localDatabase.filter(item => {
                return item.title.toLowerCase() === query || 
                       item.keywords.some(keyword => keyword === query || (query.length > 2 && keyword.includes(query)));
            });

            setTimeout(() => {
                container.innerHTML = ''; // Clear status

                if (matchedResults.length === 0) {
                    container.innerHTML = '<p class="status-msg">No structured internal entries found matching that exact keyword. Try typing "math", "computer", or a calculation like "2+1".</p>';
                    return;
                }

                matchedResults.forEach(item => {
                    const itemElement = document.createElement('div');
                    itemElement.className = 'result-item';
                    itemElement.innerHTML = `
                        <div class="result-title">${item.title}</div>
                        <p class="result-snippet">${item.snippet}</p>
                    `;
                    container.appendChild(itemElement);
                });
            }, 150);
        }
    </script>

</body>
</html>
