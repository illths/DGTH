<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dummies Guide to Hakuda (DGTH)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding-top: 40px;
            box-sizing: border-box;
        }
        .workspace {
            width: 90%;
            max-width: 800px;
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1 {
            color: #00adb5;
            margin: 0 0 5px 0;
            font-size: 2.2rem;
            letter-spacing: 1px;
        }
        .subtitle {
            color: #aaaaaa;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .search-area {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        .search-input {
            flex: 1;
            padding: 12px 18px;
            font-size: 16px;
            border: 2px solid #333;
            border-radius: 6px;
            background-color: #252525;
            color: white;
            outline: none;
            transition: border-color 0.3s;
        }
        .search-input:focus {
            border-color: #00adb5;
        }
        .search-button {
            padding: 12px 24px;
            font-size: 16px;
            background-color: #00adb5;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .search-button:hover {
            background-color: #008f96;
        }
        .results-box {
            background-color: #161616;
            border-radius: 8px;
            padding: 20px;
            border: 1px solid #2d2d2d;
            min-height: 150px;
        }
        .result-item {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #2a2a2a;
        }
        .result-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        .result-title {
            font-size: 18px;
            color: #00adb5;
            margin: 0 0 5px 0;
            font-weight: bold;
        }
        .result-snippet {
            font-size: 14px;
            color: #cccccc;
            line-height: 1.5;
            margin: 0;
        }
        .status-msg {
            color: #888888;
            font-style: italic;
            text-align: center;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <div class="workspace">
        <h1>DGTH</h1>
        <div class="subtitle">Internal Local Reference & Study Dashboard</div>
        
        <div class="search-area">
            <input type="text" id="queryInput" class="search-input" placeholder="Search built-in subject library (e.g. computer, algebra, essay)..." autocomplete="off">
            <button onclick="executeLocalSearch()" class="search-button">Search</button>
        </div>

        <div id="resultsContainer" class="results-box">
            <p class="status-msg">Results container empty. Enter a keywords query above to filter native library assets.</p>
        </div>
    </div>

    <script>
        // Local internal database containing articles completely embedded into the page
        const localDatabase = [
            {
                title: "Computer Systems & Hardware",
                keywords: ["computer", "pc", "hardware", "cpu", "ram", "technology"],
                snippet: "A computer system consists of hardware components (CPU, memory, storage, input/output devices) and software. The Central Processing Unit (CPU) executes instructions, while RAM provides volatile working memory for active processes."
            },
            {
                title: "Algebra & Mathematical Functions",
                keywords: ["math", "algebra", "calculus", "function", "equation"],
                snippet: "Algebraic expressions utilize variables, constants, and operational symbols to represent relationships. A function maps an input value to exactly one output value, commonly defined as f(x)."
            },
            {
                title: "Essay Structure & Academic Writing",
                keywords: ["essay", "writing", "english", "thesis", "paragraph"],
                snippet: "Standard academic essays follow a structured format: an introductory paragraph containing a clear thesis statement, body paragraphs providing evidence and critical analysis, and a conclusion summarizing main arguments."
            },
            {
                title: "Hakuda Techniques Overview",
                keywords: ["hakuda", "guide", "dgth", "basics"],
                snippet: "Hakuda is a hand-to-hand combat discipline focusing on physical strikes, blocks, and agility. Training emphasizes core stability, timing, and using an opponent's momentum against them."
            }
        ];

        document.getElementById('queryInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                executeLocalSearch();
            }
        });

        function executeLocalSearch() {
            const query = document.getElementById('queryInput').value.trim().toLowerCase();
            const container = document.getElementById('resultsContainer');
            
            if (!query) {
                container.innerHTML = '<p class="status-msg" style="color: #ff5722;">Please enter a search term.</p>';
                return;
            }

            container.innerHTML = '<p class="status-msg">Searching internal library indexes...</p>';

            // Filter the database array instantly without hitting any network connection
            const matchedResults = localDatabase.filter(item => {
                return item.title.toLowerCase().includes(query) || 
                       item.snippet.toLowerCase().includes(query) ||
                       item.keywords.some(keyword => keyword.includes(query));
            });

            // Delay visually for a fraction of a second to mimic an app interface
            setTimeout(() => {
                container.innerHTML = ''; // Clear status

                if (matchedResults.length === 0) {
                    container.innerHTML = '<p class="status-msg">No entries found matching that query within the local index database.</p>';
                    return;
                }

                matchedResults.forEach(item => {
                    const itemElement = document.createElement('div');
                    itemElement.className = 'result-item';
                    itemElement.innerHTML = `
                        <div class="result-title">${item.title}</div>
                        <p class="result-snippet">${item.snippet}</p>
                    `;
                    container.appendChild(itemElement);
                });
            }, 200);
        }
    </script>

</body>
</html>
