<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dummies Guide to Hakuda (DGTH)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding-top: 40px;
            box-sizing: border-box;
        }
        .workspace {
            width: 90%;
            max-width: 800px;
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1 {
            color: #00adb5;
            margin: 0 0 5px 0;
            font-size: 2.2rem;
            letter-spacing: 1px;
        }
        .subtitle {
            color: #aaaaaa;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .search-area {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        .search-input {
            flex: 1;
            padding: 12px 18px;
            font-size: 16px;
            border: 2px solid #333;
            border-radius: 6px;
            background-color: #252525;
            color: white;
            outline: none;
            transition: border-color 0.3s;
        }
        .search-input:focus {
            border-color: #00adb5;
        }
        .search-button {
            padding: 12px 24px;
            font-size: 16px;
            background-color: #00adb5;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .search-button:hover {
            background-color: #008f96;
        }
        .results-box {
            background-color: #161616;
            border-radius: 8px;
            padding: 20px;
            border: 1px solid #2d2d2d;
            min-height: 150px;
        }
        .result-item {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #2a2a2a;
        }
        .result-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        .result-title {
            font-size: 18px;
            color: #00adb5;
            margin: 0 0 5px 0;
            font-weight: bold;
        }
        .result-snippet {
            font-size: 14px;
            color: #cccccc;
            line-height: 1.5;
            margin: 0;
        }
        .status-msg {
            color: #888888;
            font-style: italic;
            text-align: center;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <div class="workspace">
        <h1>DGTH</h1>
        <div class="subtitle">Internal Reference Dashboard & Search Engine</div>
        
        <div class="search-area">
            <input type="text" id="queryInput" class="search-input" placeholder="Type a topic to fetch data..." autocomplete="off">
            <button onclick="executeFetchSearch()" class="search-button">Fetch</button>
        </div>

        <div id="resultsContainer" class="results-box">
            <p class="status-msg">Results container empty. Enter a query above to fetch data into this tab.</p>
        </div>
    </div>

    <script>
        // Trigger search when user presses Enter key
        document.getElementById('queryInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                executeFetchSearch();
            }
        });

        function executeFetchSearch() {
            const query = document.getElementById('queryInput').value.trim();
            const container = document.getElementById('resultsContainer');
            
            if (!query) {
                container.innerHTML = '<p class="status-msg" style="color: #ff5722;">Please enter a search term.</p>';
                return;
            }

            container.innerHTML = '<p class="status-msg">Fetching data from endpoint... Please wait.</p>';

            // CORRECTED URL: Contains the complete, unbroken endpoint parameters for the API call
            const targetUrl = `https://wikipedia.org{encodeURIComponent(query)}`;

            fetch(targetUrl)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response failed');
                    }
                    return response.json();
                })
                .then(data => {
                    const searchResults = data.query.search;
                    container.innerHTML = ''; // Clear loading message

                    if (searchResults.length === 0) {
                        container.innerHTML = '<p class="status-msg">No matching data returned for that query.</p>';
                        return;
                    }

                    // Dynamically build and insert the text items into the container layout
                    searchResults.forEach(item => {
                        const itemElement = document.createElement('div');
                        itemElement.className = 'result-item';

                        // Remove raw HTML formatting codes from the response object
                        const cleanSnippet = item.snippet.replace(/<\/?[^>]+(>|\$)/g, "");

                        itemElement.innerHTML = `
                            <div class="result-title">${item.title}</div>
                            <p class="result-snippet">${cleanSnippet}...</p>
                        `;
                        container.appendChild(itemElement);
                    });
                })
                .catch(error => {
                    console.error('Fetch Error:', error);
                    container.innerHTML = '<p class="status-msg" style="color: #ff5722;">An error occurred while fetching information. Please verify your connection status.</p>';
                });
        }
    </script>

</body>
</html>
