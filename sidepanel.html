<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DGTH Study Panel</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header>
    <h1>DGTH</h1>
    <nav role="tablist" aria-label="Sections">
      <button role="tab" data-tab="ask" aria-selected="true">Ask</button>
      <button role="tab" data-tab="notes" aria-selected="false">Notes</button>
      <button role="tab" data-tab="cards" aria-selected="false">Cards</button>
      <button role="tab" data-tab="timer" aria-selected="false">Timer</button>
    </nav>
  </header>

  <main>
    <!-- ASK -->
    <section id="tab-ask">
      <form id="askForm" class="row">
        <input id="queryInput" type="text" autocomplete="off" aria-label="Search"
               placeholder="Ask a question, look up a word, or enter math">
        <button type="submit" class="primary">Search</button>
      </form>

      <label class="toggle" id="aiToggleLabel">
        <input type="checkbox" id="aiToggle" disabled>
        <span id="aiToggleText">AI answers (add an API key in settings)</span>
      </label>

      <details id="settings">
        <summary>Settings</summary>
        <label for="apiKey">Anthropic API key (optional)</label>
        <input id="apiKey" type="password" placeholder="sk-ant-..." autocomplete="off">
        <label for="modelName">Model</label>
        <input id="modelName" type="text" value="claude-sonnet-5">
        <p class="note">Saved only in this browser profile and sent only to api.anthropic.com. Without a key, answers come from Wikipedia, Wikidata and a dictionary.</p>
        <div class="row">
          <button type="button" id="saveSettings">Save</button>
          <button type="button" id="clearSettings">Remove key</button>
        </div>
      </details>

      <div id="results" aria-live="polite">
        <p class="status-msg">Type a question above. You can also select text on any page, right-click, and choose "Look up in DGTH".</p>
      </div>
    </section>

    <!-- NOTES -->
    <section id="tab-notes" hidden>
      <textarea id="notesArea" aria-label="Notes" placeholder="Your notes save automatically. Use 'Add to notes' on any answer to drop it in here."></textarea>
      <div class="row">
        <button type="button" id="copyNotes">Copy</button>
        <button type="button" id="downloadNotes">Download .txt</button>
        <button type="button" id="clearNotes">Clear</button>
      </div>
      <p class="note" id="notesStatus"></p>
    </section>

    <!-- CARDS -->
    <section id="tab-cards" hidden>
      <form id="cardForm">
        <input id="cardQ" type="text" placeholder="Front (question or term)" aria-label="Card front" required>
        <input id="cardA" type="text" placeholder="Back (answer or definition)" aria-label="Card back" required>
        <button type="submit" class="primary">Add card</button>
      </form>
      <div id="cardView"></div>
      <div id="cardControls" class="row" hidden>
        <button type="button" id="cardPrev">Back</button>
        <button type="button" id="cardFlip" class="primary">Flip</button>
        <button type="button" id="cardNext">Next</button>
        <button type="button" id="cardShuffle">Shuffle</button>
        <button type="button" id="cardDelete">Delete</button>
      </div>
    </section>

    <!-- TIMER -->
    <section id="tab-timer" hidden>
      <div id="timerDisplay" class="timer" aria-live="off">--:--</div>
      <p id="timerLabel" class="note center">Ready</p>
      <div class="row">
        <button type="button" id="startFocus" class="primary">Focus 25</button>
        <button type="button" id="startBreak">Break 5</button>
        <button type="button" id="stopTimer">Stop</button>
      </div>
      <div class="row">
        <input id="customMinutes" type="number" min="1" max="180" placeholder="Custom minutes" aria-label="Custom minutes">
        <button type="button" id="startCustom">Start</button>
      </div>
    </section>
  </main>

  <script src="sidepanel.js"></script>
</body>
</html>
